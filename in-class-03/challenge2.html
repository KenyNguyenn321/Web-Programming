<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love NY T-Shirt</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #eeeeee;
        }

        .shirt-container {
            position: relative;
            width: fit-content;
            margin: 0 auto;
            padding: 25px;
            background-color: lightblue;
        }

        img {
            position: relative;
            left: 10px;
            z-index: 1;
            display: block;
            width: 600px;
            border: 5px solid black;
            padding: 10px;
            margin: 15px;
            background-color: white;
            box-shadow: 8px 8px 18px gray;
        }

        .words {
            font-family: Impact, sans-serif;
            font-size: 60px;
        }

        .first {
            position: absolute;
            top: 190px;
            left: 300px;
            z-index: 2;
        }

        .heart {
            position: absolute;
            top: 170px;
            left: 345px;
            z-index: 2;
            color: red;
            font-size: 80px;
        }

        .last {
            position: absolute;
            top: 255px;
            left: 305px;
            z-index: 2;
        }
    </style>
</head>

<body>
    <div class="shirt-container">
        <span class="first words">I</span>
        <span class="heart">&hearts;</span>
        <span class="last words">NY</span>

        <img src="tshirt.png" alt="Plain white T-shirt">
    </div>
</body>
</html>
